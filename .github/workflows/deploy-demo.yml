name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      # `--base` keeps assets and router routes under the project-site prefix
      # (`/calendar/`). The build also emits one HTML file per route plus a
      # `404.html` fallback so deep links work without server-side rewrites,
      # which GitHub Pages does not support.
      - name: Build interactive demo
        run: npm run build:demo -- --base "${{ steps.pages.outputs.base_path }}/"
      - name: Verify SPA deep-link entry points
        run: |
          for file in index.html 404.html month.html week.html navigation.html; do
            test -f "demo-dist/$file" || { echo "missing demo-dist/$file"; exit 1; }
          done
          echo "all SPA entry points present"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
